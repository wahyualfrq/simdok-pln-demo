; DEMO: konfigurasi PHP untuk runtime vercel-php (api/php.ini disalin saat build).
; Batas upload demo 4 MB (config('demo.upload_max_kb')) dicek aplikasi dengan pesan ramah; body request fungsi Vercel ±4,5 MB.
; upload_max_filesize/post_max_size SENGAJA di atas batas demo agar PHP tidak memutus lebih dulu (file 4-4,5 MB sampai ke validasi demo).
upload_max_filesize = 5M
post_max_size = 6M
memory_limit = 1024M
